<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Krish Pathak">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URI Encoding Example</title>
</head>
<body>
    <h2>URI Encoding Example</h2>
    <p>
        Original URL (with special characters): <br>
        https://example.com/search?query=HTML & CSS
    </p>

    <p>
        Correctly Encoded URL: <br>
        <a href="https://example.com/search?query=HTML%20%26%20CSS" target="_blank">
            https://example.com/search?query=HTML%20%26%20CSS
        </a>
    </p>

    <p>
        Note: Spaces are encoded as <strong>%20</strong> and the ampersand (&) is encoded as <strong>%26</strong>.
    </p>
</body>
</html>
