<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Krish Pathak">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
</head>
<body>
    <h2>Login Form</h2>
    <form method="post" action="/login">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <!-- CSRF Token prevents Cross-Site Request Forgery attacks by ensuring the request is coming from the legitimate user. -->
        <input type="hidden" name="csrf_token" value="dummy_csrf_token_12345">

        <input type="submit" value="Login">
    </form>
</body>
</html>
